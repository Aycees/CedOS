<!-- @dsCard group="Components" viewport="700x420" subtitle="Button, Card, Input, Segmented, Chip, Modal" name="Core" -->
<link rel="stylesheet" href="../../styles.css">
<div style="font-family:var(--font-mono);background:var(--bg);color:var(--text);padding:22px;display:flex;flex-direction:column;gap:18px">

  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <button style="font-family:var(--font-mono);font-size:12px;border-radius:9px;padding:10px 16px;border:none;background:var(--accent-default);color:var(--on-dark);cursor:pointer">+ new event</button>
    <button style="font-family:var(--font-mono);font-size:12px;border-radius:9px;padding:10px 16px;border:1px solid var(--border);background:none;color:var(--text);cursor:pointer">Cancel</button>
    <button style="font-family:var(--font-mono);font-size:11.5px;border:none;background:none;color:var(--accent-blue);cursor:pointer;padding:4px 6px">open calendar →</button>
    <button style="font-family:var(--font-mono);font-size:12px;border:1px dashed var(--border-strong);border-radius:8px;padding:8px 14px;background:none;color:var(--muted);cursor:pointer">+ add an event</button>
  </div>

  <div style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:10px">
    <div style="font:400 17px/1 var(--font-serif)">Tasks</div>
    <input placeholder="Search notes" style="font-family:var(--font-mono);font-size:12.5px;border:1px solid var(--border);border-radius:8px;padding:8px 11px;background:transparent;color:var(--text);outline:none">
    <input placeholder="Untitled" style="font-family:var(--font-serif);font-size:22px;border:none;background:transparent;color:var(--text);outline:none;letter-spacing:-.015em">
  </div>

  <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
    <div style="display:flex;background:color-mix(in srgb, var(--text) 7%, transparent);border-radius:8px;padding:3px;width:fit-content">
      <button style="border:none;border-radius:6px;padding:6px 13px;font-family:var(--font-mono);font-size:11.5px;background:var(--card);color:var(--text)">Comfortable</button>
      <button style="border:none;border-radius:6px;padding:6px 13px;font-family:var(--font-mono);font-size:11.5px;background:transparent;color:var(--muted)">Compact</button>
    </div>
    <span style="display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:20px;padding:7px 14px;font-family:var(--font-mono);font-size:11.5px;background:color-mix(in srgb, var(--text) 5%, transparent)"><span style="width:7px;height:7px;border-radius:50%;background:var(--accent-blue)"></span>School</span>
    <span style="display:inline-flex;align-items:center;border:1px solid var(--border);border-radius:20px;padding:7px 14px;font-family:var(--font-mono);font-size:11.5px;background:color-mix(in srgb, var(--text) 5%, transparent)">Try a gratitude prompt</span>
  </div>

  <div style="position:relative;height:150px;border-radius:12px;overflow:hidden;background:color-mix(in srgb, var(--text) 4%, transparent)">
    <div style="position:absolute;inset:0;background:var(--overlay);display:flex;align-items:center;justify-content:center">
      <div style="width:min(280px,88%);background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-modal);padding:16px 18px">
        <div style="font:400 10.5px/1 var(--font-mono);letter-spacing:.14em;color:var(--muted)">NEW EVENT</div>
        <div style="font:400 20px var(--font-serif);margin-top:8px">Event title</div>
      </div>
    </div>
  </div>
</div>
