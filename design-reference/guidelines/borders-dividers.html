<!-- @dsCard group="Spacing" viewport="700x210" subtitle="Solid card borders, dashed internal dividers and CTAs" name="Borders & Dividers" -->
<link rel="stylesheet" href="../styles.css">
<div style="font-family:var(--font-mono);background:var(--bg);padding:20px;display:flex;flex-direction:column;gap:14px">
  <div style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;font-size:12.5px;color:var(--text)">
    Card container — solid 1px border, 12px radius, flat (no shadow)
    <div style="border-top:1px dashed var(--border);margin-top:10px;padding-top:10px;color:var(--muted);font-size:11.5px">Row divider inside a card is dashed, not solid</div>
  </div>
  <div style="border:1px dashed var(--border-strong);border-radius:12px;padding:12px 16px;color:var(--muted);font-size:12px;text-align:center">+ add an event — dashed border marks an empty-state CTA</div>
</div>
