<!-- @dsCard group="Colors" viewport="700x150" subtitle="Accent palette — terracotta is default" name="Accents" -->
<link rel="stylesheet" href="../styles.css">
<div style="font-family:var(--font-mono);background:var(--bg);padding:20px;display:flex;gap:16px">

  <div style="display:flex;flex-direction:column;gap:6px;align-items:center">
    <div style="width:48px;height:48px;border-radius:50%;background:var(--accent-blue)"></div>
    <div style="font:400 10px/1.3 var(--font-mono);color:var(--muted);text-align:center">Blue</div>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px;align-items:center">
    <div style="width:48px;height:48px;border-radius:50%;background:var(--accent-green)"></div>
    <div style="font:400 10px/1.3 var(--font-mono);color:var(--muted);text-align:center">Green</div>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px;align-items:center">
    <div style="width:48px;height:48px;border-radius:50%;background:var(--accent-terracotta)"></div>
    <div style="font:400 10px/1.3 var(--font-mono);color:var(--muted);text-align:center">Terracotta*</div>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px;align-items:center">
    <div style="width:48px;height:48px;border-radius:50%;background:var(--accent-violet)"></div>
    <div style="font:400 10px/1.3 var(--font-mono);color:var(--muted);text-align:center">Violet</div>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px;align-items:center">
    <div style="width:48px;height:48px;border-radius:50%;background:var(--accent-red)"></div>
    <div style="font:400 10px/1.3 var(--font-mono);color:var(--muted);text-align:center">Red</div>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px;align-items:center">
    <div style="width:48px;height:48px;border-radius:50%;background:var(--accent-warmgray)"></div>
    <div style="font:400 10px/1.3 var(--font-mono);color:var(--muted);text-align:center">Warm gray</div>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px;align-items:center">
    <div style="width:48px;height:48px;border-radius:50%;background:var(--accent-sky)"></div>
    <div style="font:400 10px/1.3 var(--font-mono);color:var(--muted);text-align:center">Sky</div>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px;align-items:center">
    <div style="width:48px;height:48px;border-radius:50%;background:var(--accent-mauve)"></div>
    <div style="font:400 10px/1.3 var(--font-mono);color:var(--muted);text-align:center">Mauve</div>
  </div>
</div>
