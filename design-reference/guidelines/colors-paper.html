<!-- @dsCard group="Colors" viewport="700x160" subtitle="Paper (light) theme surfaces" name="Paper Surfaces" -->
<link rel="stylesheet" href="../styles.css">
<div style="font-family:var(--font-mono);background:var(--bg);padding:20px;display:flex;gap:18px">

  <div style="display:flex;flex-direction:column;gap:6px">
    <div style="width:96px;height:56px;border-radius:10px;border:1px solid var(--border);background:var(--bg)"></div>
    <div style="font:400 10.5px/1.3 var(--font-mono);color:var(--muted)">bg<br>--bg</div>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px">
    <div style="width:96px;height:56px;border-radius:10px;border:1px solid var(--border);background:var(--sidebar)"></div>
    <div style="font:400 10.5px/1.3 var(--font-mono);color:var(--muted)">sidebar<br>--sidebar</div>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px">
    <div style="width:96px;height:56px;border-radius:10px;border:1px solid var(--border);background:var(--card)"></div>
    <div style="font:400 10.5px/1.3 var(--font-mono);color:var(--muted)">card<br>--card</div>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px">
    <div style="width:96px;height:56px;border-radius:10px;border:1px solid var(--border);background:var(--text)"></div>
    <div style="font:400 10.5px/1.3 var(--font-mono);color:var(--muted)">text<br>--text</div>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px">
    <div style="width:96px;height:56px;border-radius:10px;border:1px solid var(--border);background:var(--muted)"></div>
    <div style="font:400 10.5px/1.3 var(--font-mono);color:var(--muted)">muted<br>--muted</div>
  </div>
</div>
