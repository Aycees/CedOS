<!-- @dsCard group="Spacing" viewport="700x150" subtitle="Corner radii by role" name="Radii" -->
<link rel="stylesheet" href="../styles.css">
<div style="font-family:var(--font-mono);background:var(--bg);padding:20px;display:flex;gap:20px">

  <div style="display:flex;flex-direction:column;gap:6px;align-items:center">
    <div style="width:64px;height:64px;border-radius:var(--radius-input);background:var(--card);border:1px solid var(--border)"></div>
    <div style="font:400 10px/1.3 var(--font-mono);color:var(--muted)">input 8px</div>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px;align-items:center">
    <div style="width:64px;height:64px;border-radius:var(--radius-control);background:var(--card);border:1px solid var(--border)"></div>
    <div style="font:400 10px/1.3 var(--font-mono);color:var(--muted)">control/button 9px</div>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px;align-items:center">
    <div style="width:64px;height:64px;border-radius:var(--radius-card);background:var(--card);border:1px solid var(--border)"></div>
    <div style="font:400 10px/1.3 var(--font-mono);color:var(--muted)">card 12px</div>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px;align-items:center">
    <div style="width:64px;height:64px;border-radius:var(--radius-modal);background:var(--card);border:1px solid var(--border)"></div>
    <div style="font:400 10px/1.3 var(--font-mono);color:var(--muted)">modal 14px</div>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px;align-items:center">
    <div style="width:64px;height:64px;border-radius:var(--radius-pill);background:var(--card);border:1px solid var(--border)"></div>
    <div style="font:400 10px/1.3 var(--font-mono);color:var(--muted)">pill 20px</div>
  </div>
</div>
