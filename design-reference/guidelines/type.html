<!-- @dsCard group="Type" viewport="700x220" subtitle="Newsreader (display/serif) + IBM Plex Mono (UI/data)" name="Type Specimen" -->
<link rel="stylesheet" href="../styles.css">
<div style="font-family:var(--font-mono);background:var(--bg);color:var(--text);padding:22px 24px;display:flex;flex-direction:column;gap:10px">
  <div style="font:400 30px/1.2 var(--font-serif);letter-spacing:-.015em">Today's schedule</div>
  <div style="font:400 19px/1 var(--font-serif)">Section heading</div>
  <div style="font:400 17px/1.3 var(--font-serif);font-style:italic;color:var(--muted)">Write today's entry — italic serif for reflective copy</div>
  <div style="height:1px;background:var(--hairline);margin:6px 0"></div>
  <div style="font:400 10.5px/1 var(--font-mono);letter-spacing:.14em;color:var(--muted);text-transform:uppercase">KICKER LABEL · UPPERCASE · TRACKED</div>
  <div style="font:400 13px/1.5 var(--font-mono)">Body / list text sits in IBM Plex Mono at 12–13.5px</div>
  <div style="font:400 27px/1 var(--font-mono);letter-spacing:-.02em">$1,240 <span style="font-size:11.5px;color:var(--muted)">left of $2,000</span></div>
</div>
