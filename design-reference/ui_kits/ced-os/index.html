<!-- @dsCard group="Ced OS" viewport="1200x680" subtitle="Today dashboard, light/dark" name="Today Dashboard" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:var(--font-mono);background:var(--bg);color:var(--text)}
  .shell{display:flex;height:100vh;overflow:hidden}
  .nav-btn{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;border:none;background:none;font:400 12.5px var(--font-mono);color:var(--muted);cursor:pointer;text-align:left;width:100%}
  .nav-btn.active{background:color-mix(in srgb, var(--text) 6%, transparent);color:var(--text)}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px}
  .row{display:flex;gap:14px;padding:14px 0;border-top:1px dashed var(--border)}
  .link{background:none;border:none;color:var(--accent-blue);font:400 11.5px var(--font-mono);cursor:pointer;padding:0}
</style>
</head>
<body>
<div class="shell">
  <aside style="flex:none;width:216px;background:var(--sidebar);display:flex;flex-direction:column;border-right:1px solid var(--border)">
    <div style="padding:20px 20px 4px;display:flex;align-items:center;gap:9px">
      <div style="font:500 13px var(--font-mono)">Ced OS</div>
      <button id="themeBtn" title="Toggle day/night" style="margin-left:auto;width:26px;height:26px;border-radius:7px;border:1px solid var(--border);background:none;color:var(--muted);cursor:pointer">☀</button>
    </div>
    <nav style="display:flex;flex-direction:column;gap:2px;padding:14px 12px">
      <button class="nav-btn active">Today</button>
      <button class="nav-btn">Notes</button>
      <button class="nav-btn">Calendar</button>
      <button class="nav-btn">Habits</button>
      <button class="nav-btn">Finance</button>
      <button class="nav-btn">Journal</button>
    </nav>
    <div style="margin-top:auto;padding:14px 20px 18px;border-top:1px dashed var(--border);font:400 11px/1.5 var(--font-mono);color:var(--muted)">SAT · AUG 8<br>Mika</div>
  </aside>
  <main style="flex:1;display:flex;flex-direction:column;min-width:0">
    <header style="padding:22px 32px 16px;border-bottom:1px solid var(--border)">
      <div style="font:400 10.5px var(--font-mono);letter-spacing:.14em;color:var(--muted);text-transform:uppercase">SATURDAY, AUGUST 8</div>
      <h1 style="font:400 27px var(--font-serif);margin:9px 0 0;letter-spacing:-.012em">Today</h1>
    </header>
    <div style="flex:1;overflow:auto;padding:26px 32px;display:grid;grid-template-columns:1.3fr 1fr;gap:22px;align-items:start;max-width:1040px">
      <section class="card" style="padding:20px 22px 8px">
        <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:4px">
          <h2 style="font:400 18px var(--font-serif);margin:0">Today's schedule</h2>
          <button class="link" style="margin-left:auto">open calendar →</button>
        </div>
        <div class="row"><div style="flex:none;width:60px;font-size:12px;color:var(--muted)">09:30</div><div style="width:8px;height:8px;border-radius:50%;background:var(--accent-blue);margin-top:5px"></div><div>Library block — chapter 3</div></div>
        <div class="row"><div style="flex:none;width:60px;font-size:12px;color:var(--muted)"></div><div style="width:8px;height:8px;border-radius:50%;background:var(--accent-violet);margin-top:5px"></div><div>Grocery run</div></div>
        <div class="row"><div style="flex:none;width:60px;font-size:12px;color:var(--muted)">19:00</div><div style="width:8px;height:8px;border-radius:50%;background:var(--accent-violet);margin-top:5px"></div><div>Rina's birthday dinner</div></div>
      </section>
      <div style="display:flex;flex-direction:column;gap:18px">
        <section class="card" style="padding:18px 20px">
          <div style="display:flex;align-items:baseline;margin-bottom:10px"><h2 style="font:400 18px var(--font-serif);margin:0">Tasks</h2><button class="link" style="margin-left:auto">all →</button></div>
          <div style="display:flex;gap:10px;padding:6px 0;font-size:13px"><span style="width:15px;height:15px;border:1.5px solid var(--checkbox);border-radius:4px"></span>Email advisor re: sample size</div>
          <div style="display:flex;gap:10px;padding:6px 0;font-size:13px"><span style="width:15px;height:15px;border:1.5px solid var(--checkbox);border-radius:4px"></span>Pay water bill</div>
        </section>
        <section class="card" style="padding:18px 20px">
          <div style="display:flex;align-items:baseline;margin-bottom:12px"><h2 style="font:400 18px var(--font-serif);margin:0">This month</h2><button class="link" style="margin-left:auto">finance →</button></div>
          <div style="display:flex;align-items:baseline;gap:8px"><div style="font:400 26px var(--font-mono);letter-spacing:-.02em">$1,240</div><div style="font-size:11px;color:var(--muted)">left of $2,000</div></div>
          <div style="margin-top:10px;height:7px;border-radius:4px;background:color-mix(in srgb, var(--text) 9%, transparent);overflow:hidden"><div style="width:62%;height:100%;background:var(--accent-green)"></div></div>
        </section>
      </div>
    </div>
  </main>
</div>
<script>
document.getElementById('themeBtn').onclick = function(){
  var dark = document.body.getAttribute('data-theme') === 'dark';
  document.body.setAttribute('data-theme', dark ? '' : 'dark');
  this.textContent = dark ? '☀' : '☽';
};
</script>
</body>
</html>
